name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      # Static HTML export of each deck, so plain HTTP clients (agents, crawlers) can read
      # the text and image URLs. Uses open-slide's own "Export as HTML" in headless Chromium.
      - name: Install Playwright (not a project dependency)
        run: |
          npm install --no-save playwright@1.61.1
          npx playwright install --with-deps chromium
      - name: Export static HTML
        run: |
          npx open-slide preview --port 4747 > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:4747/ > /dev/null && break; sleep 1; done
          node scripts/export-static.cjs http://localhost:4747 dist/static
      - name: Pages extras (SPA fallback, 200 per deck, llms.txt, custom domain)
        run: bash scripts/pages-extras.sh dist slides.grimmer.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
